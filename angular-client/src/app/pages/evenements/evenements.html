<h2 class="font-serif italic text-marron-dark text-4xl m-8 ml-2">Les évènements</h2>

<div class="flex flex-row flex-wrap justify-center gap-10">
    @for (tab of tabs(); track tab.id){
        <app-card-salon 
        [titre]="tab.titre"
        [description]="tab.description"
        [ville]="tab.ville"
        [date]="tab.date"
        [heure]="tab.heure"
        [image]="tab.photo_1"
        [image2]="tab.photo_2"
        [statut]="tab.statut"
        />
    }
</div>
