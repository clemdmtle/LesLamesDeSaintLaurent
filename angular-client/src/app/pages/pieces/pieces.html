<div class="flex flex-row justify-between items-center mr-15">
    <h2 class="font-serif italic text-marron-dark text-4xl m-8 ml-2">Les pièces disponibles par gamme</h2>

    @if (authService.estConnecte()) {
        <app-button [type]="ButtonTypeEnum.PRIMARY" [iconOnly]="true" (click)="openModal()">
            <i class="pi pi-plus text-xl"></i>
        </app-button>
    }
</div>

<div class="card">
    <p-accordion class="bg-fond!" [value]="['0']">
        @for (tab of tabs(); track tab.title) {
            <p-accordion-panel class="bg-fond!" [value]="tab.value">
                <p-accordion-header class="bg-fond! font-lora! text-marron-medium!">{{ tab.title }}</p-accordion-header>
                <p-accordion-content class="bg-fond!">
                    <div class="flex flex-row flex-wrap justify-center gap-10">
                        @for (couteau of tab.couteaux; track couteau.id) {
                            <app-card-couteau
                                [images]="couteau.images"
                                [lame]="couteau.lame"
                                [garde]="couteau.garde"
                                [manche]="couteau.manche"
                                [etui]="couteau.etui"
                                [prix]="couteau.prix"
                                (modifier)="modifierCouteau(couteau)"
                                (supprimer)="supprimerCouteau(couteau)"
                                (rendreDisponible)="rendreDisponibleCouteau(couteau)"
                            ></app-card-couteau>
                        }
                    </div>
                </p-accordion-content>
            </p-accordion-panel>
        }
    </p-accordion>
</div>

<app-modal-couteau [(visible)]="isModalVisible" [couteau]="couteauEnEdition()"></app-modal-couteau>
