<div class="pb-4 p-8 flex items-center justify-center bg-fond">
            <p-card header="{{titre()}}" [style]="{ width: '25rem', height: '700px', overflow: 'hidden', borderRadius: '1rem' }">
                <ng-template #header>
                    <p-galleria [value]="images()" [containerStyle]="{ width: '100%', height: '100%' }" [numVisible]="5">
                        <ng-template #item let-item>
                            <img [src]="item.itemImageSrc" class="w-full h-80 object-contain" />
                        </ng-template>
                        <ng-template #thumbnail let-item>
                            <img [src]="item.thumbnailImageSrc" />
                        </ng-template>
                    </p-galleria>
                    <div class="flex flex-row gap-2 mt-4 mb-0 mx-4">
                        <app-tag [texte]="date()"></app-tag>
                        <app-tag [texte]="heure()"></app-tag>
                        <app-tag [texte]="ville()"></app-tag>
                    </div>
                </ng-template>
                <div class="flex flex-col gap-2 text-md">
                    <p>{{description()}}</p>
                </div>

            </p-card>
        </div>
