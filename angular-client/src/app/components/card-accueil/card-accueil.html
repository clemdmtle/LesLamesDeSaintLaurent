<div class="mb-4 p-8 flex items-center justify-center">
            <p-card [style]="{ width: '25rem', height: '522px', overflow: 'hidden' }">
                <ng-template #header>
                    <img alt="Card" class="w-full" src={{image()}} />
                </ng-template>
                <p class="text-xl">
                    {{texte()}}
                </p>
                <ng-template #footer>
                    <a class="flex text-marron-dark underline text-xl justify-center mt-auto hover:text-orange-flash" href={{lien()}}>En savoir plus</a>
                </ng-template>
            </p-card>
        </div>
