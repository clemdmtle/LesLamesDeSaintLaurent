@if (lien()) {
  <a [href]="lien()">
    <button type="button" 
      class="rounded-2xl shadow-xl hover:scale-105 flex items-center justify-center gap-2"
      [ngClass]="{
        'bg-orange-flash text-white!': type() === ButtonTypeEnum.PRIMARY, 
        'bg-white text-marron-medium': type() === ButtonTypeEnum.SECONDARY, 
        'bg-beige-medium text-white': type() === ButtonTypeEnum.TERTIARY,
        'text-xl py-2 px-4': !iconOnly(),
        'p-3': iconOnly()
      }">
      <ng-content></ng-content>
      @if (texte()) { <span>{{ texte() }}</span> }
    </button>
  </a>
} @else if (type()==ButtonTypeEnum.UPDATE) {
  <button
      type="button"
      title="Modifier"
      aria-label="Modifier"
      class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full bg-white/90 text-marron-medium shadow-md transition-colors hover:bg-marron-medium hover:text-white">
      <i class="pi pi-pencil"></i>
  </button>
  
} @else if (type()==ButtonTypeEnum.DELETE) {
  <button
    type="button"
    title="Supprimer"
    aria-label="Supprimer"
    class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full bg-white/90 text-red-700 shadow-md transition-colors hover:bg-red-700 hover:text-white">
    <i class="pi pi-trash"></i>
  </button>
} @else if (type() === ButtonTypeEnum.SOLD) {
  <button
    type="button"
    class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg bg-vert-bois px-4 py-2.5 mt-4 font-medium text-white transition-opacity hover:opacity-90"
  >
    <i class="pi pi-tag"></i>
    <span>Marquer comme vendu</span>
  </button>
} @else {
  <button type="button" 
    class="rounded-2xl shadow-xl hover:scale-105 flex items-center justify-center gap-2"
    [ngClass]="{
      'bg-orange-flash text-white!': type() === ButtonTypeEnum.PRIMARY, 
      'bg-white text-marron-medium': type() === ButtonTypeEnum.SECONDARY, 
      'bg-beige-medium text-white': type() === ButtonTypeEnum.TERTIARY,
      'text-xl py-2 px-4': !iconOnly(),
      'p-3': iconOnly()
    }">
    <ng-content></ng-content>
    @if (texte()) { <span>{{ texte() }}</span> }
  </button>
}
