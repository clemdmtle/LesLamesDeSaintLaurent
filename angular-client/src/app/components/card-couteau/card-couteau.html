<div class="pb-4 p-8 flex items-center justify-center bg-fond">
    <p-card [style]="{ width: '25rem' }">
        <ng-template #header>
            <div class="relative">
                @if (authService.estConnecte()) {
                    <div class="absolute right-3 top-3 z-20 flex gap-2">
                        <app-button [type]="ButtonTypeEnum.UPDATE" (click)="modifier.emit()" />
                        <app-button [type]="ButtonTypeEnum.DELETE" (click)="supprimer.emit()" />
                    </div>
                }

                <p-galleria
                    [value]="galerie()"
                    [containerStyle]="{ width: '100%' }"
                    [numVisible]="3"
                    [showThumbnails]="galerie().length > 1"
                    [showItemNavigators]="galerie().length > 1"
                >
                    <ng-template #item let-item>
                        <div class="flex h-72 w-full items-center justify-center overflow-hidden">
                            <img [src]="item.itemImageSrc" alt="Photo du couteau" class="max-h-full max-w-full object-contain" />
                        </div>
                    </ng-template>
                    <ng-template #thumbnail let-item>
                        <img [src]="item.thumbnailImageSrc" alt="Miniature" class="h-14 w-14 object-cover" />
                    </ng-template>
                </p-galleria>
            </div>
        </ng-template>

        <div class="flex flex-col gap-2 text-md">
            <p class="font-bold">Matières :</p>
            <ul class="list-disc list-inside">
                <li class="m-2"><strong>Lame :</strong> {{ lame() }}</li>
                <li class="m-2"><strong>Garde :</strong> {{ garde() }}</li>
                <li class="m-2"><strong>Manche :</strong> {{ manche() }}</li>
            </ul>
            <p><strong>Etui :</strong> {{ etui() }}</p>
            @if (prix() != null) {
                <p><strong>Prix :</strong> {{ prix() }} €</p>
            }
        </div>
        @if (prix() != null){
            <app-button [type]="ButtonTypeEnum.SOLD" (click)="rendreDisponible.emit()"></app-button>
        }
    </p-card>
</div>
