<div class="pb-4 p-8 flex items-center justify-center bg-fond">
            <p-card [style]="{ width: '25rem', height: '700px', overflow: 'hidden' }">
                <ng-template #header>
                    <p-galleria [value]="images()" [containerStyle]="{ width: '100%', height: '100%' }" [numVisible]="5">
                        <ng-template #item let-item>
                            <img [src]="item.itemImageSrc" class="w-full h-80 object-contain" />
                        </ng-template>
                        <ng-template #thumbnail let-item>
                            <img [src]="item.thumbnailImageSrc" />
                        </ng-template>
                    </p-galleria>
                </ng-template>
                <div class="flex flex-col gap-2 text-md">
                    <p>
                    Matières :
                </p>
                <ul class="list-disc list-inside">
                    <li class="m-2">Lame : {{lame()}}</li>
                    <li class="m-2">Garde : {{garde()}}</li>
                    <li class="m-2">Manche : {{manche()}}</li>
                </ul>
                <p>Etui : {{etui()}}</p>
                <p>Prix : {{prix()}}</p>
                </div>

            </p-card>
        </div>
