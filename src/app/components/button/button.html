<button class="rounded-2xl text-xl py-2 px-4 shadow-xl hover:scale-105" 
[ngClass]="{'bg-orange-flash text-white!': type() === ButtonTypeEnum.PRIMARY, 
'bg-white text-marron-medium': type() === ButtonTypeEnum.SECONDARY, 
'bg-beige-medium text-white': type() === ButtonTypeEnum.TERTIARY}">{{texte()}}</button>
