<h3 class="flex justify-center font-lora font-medium text-2xl">Les modèles</h3>
<div class="flex flex-row flex-wrap justify-center items-center gap-4 bg-fond">
    @for (modele of modeles; track modele.nom){
        <p-card header="{{modele.nom}}" [style]="{ width: '25rem', height: '500px', overflow: 'hidden', borderRadius: '1rem', margin: '2rem' }">
            <ng-template #header>
                <img [src]="modele.image" alt="Image" class="w-full h-64 object-cover rounded-t-lg" />
            </ng-template>
            <div class="flex flex-col gap-2 text-md">
                <p>{{modele.description}}</p>
            </div>

        </p-card>
    }
</div>
